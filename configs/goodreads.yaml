# configs/goodreads.yaml — GoodReads cold-start experiment
dataset: goodreads
data_dir: data/raw/GoodReads
output_dir: outputs/goodreads
pair_dir: data/goodreads_pairs

min_reviews_per_book: 20000

# Pair generation
n_users: 10
pairs_per_user: 40
prompt_templates:
  simple: "Which book does the reader prefer: {title_a} or {title_b}?"
  detailed: "Given these two books, which one would the reader enjoy more? Book A: {title_a}. Book B: {title_b}. The reader prefers:"
  system: "You are a book recommendation assistant. A reader is choosing between {title_a} and {title_b}. Which do they prefer?"
default_prompt: simple

# Model
model_id: meta-llama/Meta-Llama-3-8B-Instruct

# Cold-start sweep
cold_start_sizes: [3, 5, 10]
eval_pairs_per_user: 10
n_eval_users: 3
random_seed: 42

# Training
num_train_epochs: 1
batch_size: 2
learning_rate: 2.0e-5
max_grad_norm: 1.0
max_seq_len: 256

# LoRA
lora_r: 8
lora_alpha: 16
lora_target_modules: ["q_proj", "v_proj"]
lora_dropout: 0.05

# Loss hyperparameters
dpo_beta: 0.1
ipo_beta: 0.1
kto_beta: 0.1
simpo_beta: 2.0
simpo_gamma: 0.5

# In-context learning
icl_max_seq_len: 2048