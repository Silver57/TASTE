# configs/goodreads_judge.yaml — LLM-as-judge sub-study
# Loads pair data prepared for the main goodreads sweep, then for a small slice
# of users generates one-sentence recommendations under three conditions and
# has Claude Sonnet 4.6 judge them pairwise.
dataset: 15_05_base_results
pair_dir: data/goodreads_pairs
output_dir: outputs/judge_study

model_id: meta-llama/Meta-Llama-3-8B-Instruct

# Source of eval_users — first 10 are reused for this sub-study so the judge
# wins can be cross-referenced against the main sweep's logged accuracies.
main_results_path: Final Results/15_05_base_results/results.json
n_judge_users: 10
n_judge_pairs: 10

# Conditions (base/untrained always included as catch trial)
simpo_n_train: 100
icl_n_demos: 10

# Shared with main sweep — must match goodreads.yaml so the UserSplitter and
# SimPO trainer behave identically.
eval_pairs_per_user: 30
random_seed: 42

# Training (SimPO@n=100) — mirror goodreads.yaml
num_train_epochs: 3
batch_size: 4
learning_rate: 0.00002
max_grad_norm: 1.0
max_seq_len: 512
lora_r: 16
lora_alpha: 32
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
lora_dropout: 0.05
simpo_beta: 2.0
simpo_gamma: 0.5

# Generation
gen_max_new_tokens: 80
gen_temperature: 0.7
gen_top_p: 0.9
icl_max_seq_len: 8192

# Judge
judge_model: claude-sonnet-4-6
judge_temperature: 0.0
judge_max_tokens: 400
judge_retries: 1
judge_order_seed: 7
profile_size: 5  # 5 liked + 5 disliked shown to the judge

# Safety caps
max_api_calls: 200       # expected ~300; aborts run if exceeded
hard_budget_usd: 3.00